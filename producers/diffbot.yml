# Producers over the Diffbot Knowledge Graph.
#
# ONE SHAPE RUNS THROUGH ALL OF THESE. Diffbot's cross-entity fields (parentCompany, ceo, employer,
# competitors, tags) are resolved references carrying the target's id, and DQL can filter on those
# ids — `type:Organization parentCompany.id:or("E1","E2")` is a legal query. What DQL cannot do is
# FOLLOW them: there is no traversal, no join, no path. So every producer here is one flat,
# id-keyed reverse lookup, and the traversal lives in the graph pattern the user writes.
#
# That is why almost every join keys on `diffbotId` — our own bound node's id — rather than on a
# projected list of target ids. A reverse lookup batches (`or(...)` takes many ids in one call) and
# needs no list projection; a forward list would need both. The two forward joins that remain
# (parentCompany, ceo) key on single scalars Diffbot puts on the record itself.
#
# COST IS REAL, AND THE FREE TIER IS TINY. Diffbot bills per ENTITY EXPORTED (~25 credits), not per
# call, and the free plan allots 10,000 credits a month — 400 entity exports, total. So `size` is a
# spending decision on every producer below, and asking for the endpoint maximum of 50 would spend
# an eighth of the month on ONE fetch. It is 10 here (20 for the plain-language searches), and no
# producer pages. The response's own `hits` reports what the index matched, so a narrow answer to a
# wide question is visible rather than hidden.
#
# RATE IS TIER-DEPENDENT. The free plan allows 5 requests per MINUTE; Startup allows 5 per SECOND —
# a 60x difference behind an identical token. This is paced for STARTUP. On the free plan drop every
# `rate:` here to "4/min", or the realm bursts 60x too fast and spends the month on 429s; on Plus
# raise it to "25/sec".

# ---------------------------------------------------------------------------------------------
# Entity resolution — turning something we hold into a Diffbot identity.
# ---------------------------------------------------------------------------------------------

# The bridge producer for Organization. Enhance, not DQL: enhance is Diffbot's own scoring of
# candidates against partial input, which is exactly the entity-resolution problem, and it returns
# the best match rather than a list we would have to pick from ourselves.
#
# Keyed on DOMAIN because a domain identifies a company and a name does not — "Acme" matches dozens
# of records across countries and industries, and picking the highest-scoring one silently attributes
# another company's revenue, headcount and owner to yours. threshold keeps a weak match out
# entirely: for a bridge that gets PERSISTED, a wrong link is worse than no link.
- name: orgEnhanceByDomain
  kind: remote
  operation: enhance
  keyArg: url
  echoKeyAs: matchedFor        # enhance answers with the entity, not with what we asked — stamp it
  args:
    type: Organization
    threshold: 0.7
  records: "$.data[*].entity"
  project:
    diffbotId: id
    name: name
    homepageUri: homepageUri
    summary: summary
    nbEmployees: nbEmployees
    nbEmployeesMin: nbEmployeesMin
    nbEmployeesMax: nbEmployeesMax
    revenue: revenue.value
    revenueCurrency: revenue.currency
    foundingDate: foundingDate.str
    foundingDateTimestamp: foundingDate.timestamp
    isPublic: isPublic
    isAcquired: isAcquired
    isDissolved: isDissolved
    isNonProfit: isNonProfit
    importance: importance
    nbOrigins: nbOrigins
    industries: industries
    descriptors: descriptors
    city: location.city.name
    region: location.region.name
    country: location.country.name
    parentCompanyId: parentCompany.targetDiffbotId
    parentCompanyName: parentCompany.name
    ultimateParentId: ultimateParent.targetDiffbotId
    ultimateParentName: ultimateParent.name
    acquiredById: acquiredBy.targetDiffbotId
    acquiredByName: acquiredBy.name
    ceoId: ceo.targetDiffbotId
    ceoName: ceo.name
    stockSymbol: stock.symbol
    stockExchange: stock.exchange
    capitalization: capitalization.value
    linkedInUri: linkedInUri
    crunchbaseUri: crunchbaseUri
    githubUri: githubUri
    twitterUri: twitterUri
    diffbotUri: diffbotUri
  cache:
    kind: ttl
    seconds: 2592000          # 30 days — a company's Diffbot identity is stable; its facts are not
    # A domain Diffbot has never indexed stays unindexed for a while. Without this, every private
    # company and every personal domain in the address book is re-asked on every query that walks
    # the bridge — the exact anchors most likely to miss are the ones re-asked most.
    negativeTtlSeconds: 604800
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: high

# Person bridge. Email, for the same reason Organization uses domain: it identifies, a name does
# not. Diffbot knows public professional email addresses; a personal address usually misses, which
# is why the negative cache matters as much as the positive one.
- name: personEnhanceByEmail
  kind: remote
  operation: enhance
  keyArg: email
  echoKeyAs: matchedFor
  args:
    type: Person
    threshold: 0.7
  records: "$.data[*].entity"
  project:
    diffbotId: id
    name: name
    summary: summary
    description: description
    importance: importance
    nbOrigins: nbOrigins
    currentTitle: employments.0.title
    currentEmployerId: employments.0.employer.targetDiffbotId
    currentEmployerName: employments.0.employer.name
    # The whole career, flattened. `[*]` lifts an array into a top-level LIST property, which is what
    # makes a career graph possible: employerIds keys a per-element join, so one person node fans out
    # to every company they have worked for instead of only the most recent.
    employerIds: employments[*].employer.targetDiffbotId
    employerNames: employments[*].employer.name
    titles: employments[*].title
    city: location.city.name
    region: location.region.name
    country: location.country.name
    linkedInUri: linkedInUri
    githubUri: githubUri
    twitterUri: twitterUri
    crunchbaseUri: crunchbaseUri
    diffbotUri: diffbotUri
  cache:
    kind: ttl
    seconds: 2592000
    negativeTtlSeconds: 604800
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: high

# ---------------------------------------------------------------------------------------------
# Id lookups — the workhorses. Every structural hop lands here.
# ---------------------------------------------------------------------------------------------

# Batched by construction: `id:or("E1","E2",…)` is one call for many anchors, which is what keeps a
# four-level ownership walk from being four-times-N calls. batchSafe stays at its default (true)
# because an id query is not a ranked search — every requested id that exists comes back, so one
# call IS complete per key and the starvation trap that forces per-key fetching elsewhere does not
# apply here.
- name: orgsById
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Organization id:or({keys})"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  maxKeysPerCall: 50          # the endpoint's own result ceiling — more ids than that cannot answer
  records: "$.data[*].entity"
  # Written out in full rather than shared with a YAML anchor. Jackson's YAML parser resolves
  # anchors only for SCALARS: an alias to a mapping arrives as the bare string 'orgProjection',
  # which cannot bind to Map<String,String>, and one unbindable entry fails the WHOLE file — so
  # every producer in it silently disappears and the first fetch reports 'Unknown producer'.
  project:
    diffbotId: id
    name: name
    homepageUri: homepageUri
    summary: summary
    nbEmployees: nbEmployees
    nbEmployeesMin: nbEmployeesMin
    nbEmployeesMax: nbEmployeesMax
    revenue: revenue.value
    revenueCurrency: revenue.currency
    foundingDate: foundingDate.str
    foundingDateTimestamp: foundingDate.timestamp
    isPublic: isPublic
    isAcquired: isAcquired
    isDissolved: isDissolved
    isNonProfit: isNonProfit
    importance: importance
    nbOrigins: nbOrigins
    industries: industries
    descriptors: descriptors
    city: location.city.name
    region: location.region.name
    country: location.country.name
    parentCompanyId: parentCompany.targetDiffbotId
    parentCompanyName: parentCompany.name
    ultimateParentId: ultimateParent.targetDiffbotId
    ultimateParentName: ultimateParent.name
    acquiredById: acquiredBy.targetDiffbotId
    acquiredByName: acquiredBy.name
    ceoId: ceo.targetDiffbotId
    ceoName: ceo.name
    stockSymbol: stock.symbol
    stockExchange: stock.exchange
    capitalization: capitalization.value
    linkedInUri: linkedInUri
    crunchbaseUri: crunchbaseUri
    githubUri: githubUri
    twitterUri: twitterUri
    diffbotUri: diffbotUri
  cache:
    kind: ttl
    seconds: 86400
    negativeTtlSeconds: 86400  # an id the graph does not hold stays unheld
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: high

- name: peopleById
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Person id:or({keys})"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  maxKeysPerCall: 50
  records: "$.data[*].entity"
  # Written out in full rather than shared with a YAML anchor. Jackson's YAML parser resolves
  # anchors only for SCALARS: an alias to a mapping arrives as the bare string 'personProjection',
  # which cannot bind to Map<String,String>, and one unbindable entry fails the WHOLE file — so
  # every producer in it silently disappears and the first fetch reports 'Unknown producer'.
  project:
    diffbotId: id
    name: name
    summary: summary
    description: description
    importance: importance
    nbOrigins: nbOrigins
    currentTitle: employments.0.title
    currentEmployerId: employments.0.employer.targetDiffbotId
    currentEmployerName: employments.0.employer.name
    # The whole career, flattened. `[*]` lifts an array into a top-level LIST property, which is what
    # makes a career graph possible: employerIds keys a per-element join, so one person node fans out
    # to every company they have worked for instead of only the most recent.
    employerIds: employments[*].employer.targetDiffbotId
    employerNames: employments[*].employer.name
    titles: employments[*].title
    city: location.city.name
    region: location.region.name
    country: location.country.name
    linkedInUri: linkedInUri
    githubUri: githubUri
    twitterUri: twitterUri
    crunchbaseUri: crunchbaseUri
    diffbotUri: diffbotUri
  cache:
    kind: ttl
    seconds: 86400
    negativeTtlSeconds: 86400
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: high

# ---------------------------------------------------------------------------------------------
# Reverse lookups — the hops DQL can answer one level at a time, and we compose.
# ---------------------------------------------------------------------------------------------

# Children of a company. Keyed on the PARENT's id, so `(:DiffbotOrganization)<-[:SUBSIDIARY_OF]-`
# resolves downward without any list field being projected. This is the direction Diffbot's own
# docs demonstrate (`type:Organization parentCompany.id:or(...)` for the subsidiaries of several
# companies at once), so it is the best-supported query in the realm.
- name: orgsByParent
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Organization parentCompany.id:or({keys})"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  maxKeysPerCall: 25          # each parent can have many children; keep one call's 50-cap shared thin
  records: "$.data[*].entity"
  # Written out in full rather than shared with a YAML anchor. Jackson's YAML parser resolves
  # anchors only for SCALARS: an alias to a mapping arrives as the bare string 'orgProjection',
  # which cannot bind to Map<String,String>, and one unbindable entry fails the WHOLE file — so
  # every producer in it silently disappears and the first fetch reports 'Unknown producer'.
  project:
    diffbotId: id
    name: name
    homepageUri: homepageUri
    summary: summary
    nbEmployees: nbEmployees
    nbEmployeesMin: nbEmployeesMin
    nbEmployeesMax: nbEmployeesMax
    revenue: revenue.value
    revenueCurrency: revenue.currency
    foundingDate: foundingDate.str
    foundingDateTimestamp: foundingDate.timestamp
    isPublic: isPublic
    isAcquired: isAcquired
    isDissolved: isDissolved
    isNonProfit: isNonProfit
    importance: importance
    nbOrigins: nbOrigins
    industries: industries
    descriptors: descriptors
    city: location.city.name
    region: location.region.name
    country: location.country.name
    parentCompanyId: parentCompany.targetDiffbotId
    parentCompanyName: parentCompany.name
    ultimateParentId: ultimateParent.targetDiffbotId
    ultimateParentName: ultimateParent.name
    acquiredById: acquiredBy.targetDiffbotId
    acquiredByName: acquiredBy.name
    ceoId: ceo.targetDiffbotId
    ceoName: ceo.name
    stockSymbol: stock.symbol
    stockExchange: stock.exchange
    capitalization: capitalization.value
    linkedInUri: linkedInUri
    crunchbaseUri: crunchbaseUri
    githubUri: githubUri
    twitterUri: twitterUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: medium

# Companies that name this one as a competitor. NOT the same as the company's own `competitors`
# list — this is the inbound view, and the two disagree often enough that conflating them would be
# a claim we cannot support. Named COMPETES_WITH in the type and documented as inbound.
- name: orgsByCompetitor
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Organization competitors.id:or({keys})"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  # Per-anchor, for the same reason articlesByEntity is: the records that come back are OTHER
  # companies, and their own id identifies them rather than the anchor we searched for. Nothing in
  # the response says which queried id a given competitor matched, so a batched call yields rows
  # that cannot be linked back and the edge silently never forms. Echo the queried id instead.
  echoKeyAs: matchedFor
  batchSafe: false
  records: "$.data[*].entity"
  # Written out in full rather than shared with a YAML anchor. Jackson's YAML parser resolves
  # anchors only for SCALARS: an alias to a mapping arrives as the bare string 'orgProjection',
  # which cannot bind to Map<String,String>, and one unbindable entry fails the WHOLE file — so
  # every producer in it silently disappears and the first fetch reports 'Unknown producer'.
  project:
    diffbotId: id
    name: name
    homepageUri: homepageUri
    summary: summary
    nbEmployees: nbEmployees
    nbEmployeesMin: nbEmployeesMin
    nbEmployeesMax: nbEmployeesMax
    revenue: revenue.value
    revenueCurrency: revenue.currency
    foundingDate: foundingDate.str
    foundingDateTimestamp: foundingDate.timestamp
    isPublic: isPublic
    isAcquired: isAcquired
    isDissolved: isDissolved
    isNonProfit: isNonProfit
    importance: importance
    nbOrigins: nbOrigins
    industries: industries
    descriptors: descriptors
    city: location.city.name
    region: location.region.name
    country: location.country.name
    parentCompanyId: parentCompany.targetDiffbotId
    parentCompanyName: parentCompany.name
    ultimateParentId: ultimateParent.targetDiffbotId
    ultimateParentName: ultimateParent.name
    acquiredById: acquiredBy.targetDiffbotId
    acquiredByName: acquiredBy.name
    ceoId: ceo.targetDiffbotId
    ceoName: ceo.name
    stockSymbol: stock.symbol
    stockExchange: stock.exchange
    capitalization: capitalization.value
    linkedInUri: linkedInUri
    crunchbaseUri: crunchbaseUri
    githubUri: githubUri
    twitterUri: twitterUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: low

# Current employees of a company, as Diffbot knows them — which means the publicly visible ones,
# skewed heavily toward people with a LinkedIn or a byline. Useful as a route into a company;
# never a headcount. `nbEmployees` on the Organization is the headcount; counting these nodes is
# counting Diffbot's coverage of a company, not its staff.
- name: peopleByEmployer
  kind: remote
  operation: dqlSearch
  args:
    # Braces here are DQL's own subquery syntax, not template placeholders — only the named
    # {keys} / {filters} slots are substituted.
    query: "type:Person employments.{employer.id:or({keys}) isCurrent:true}"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  # Echoed rather than read back off the record. `currentEmployerId` is projected from
  # `employments.0`, which is USUALLY the current role but is not guaranteed to be the one that
  # matched — a person with two concurrent employments can come back with the wrong one first, and
  # the join would then quietly drop them. Echoing the queried employer id makes the link exact.
  echoKeyAs: matchedFor
  batchSafe: false
  records: "$.data[*].entity"
  # Written out in full rather than shared with a YAML anchor. Jackson's YAML parser resolves
  # anchors only for SCALARS: an alias to a mapping arrives as the bare string 'personProjection',
  # which cannot bind to Map<String,String>, and one unbindable entry fails the WHOLE file — so
  # every producer in it silently disappears and the first fetch reports 'Unknown producer'.
  project:
    diffbotId: id
    name: name
    summary: summary
    description: description
    importance: importance
    nbOrigins: nbOrigins
    currentTitle: employments.0.title
    currentEmployerId: employments.0.employer.targetDiffbotId
    currentEmployerName: employments.0.employer.name
    # The whole career, flattened. `[*]` lifts an array into a top-level LIST property, which is what
    # makes a career graph possible: employerIds keys a per-element join, so one person node fans out
    # to every company they have worked for instead of only the most recent.
    employerIds: employments[*].employer.targetDiffbotId
    employerNames: employments[*].employer.name
    titles: employments[*].title
    city: location.city.name
    region: location.region.name
    country: location.country.name
    linkedInUri: linkedInUri
    githubUri: githubUri
    twitterUri: twitterUri
    crunchbaseUri: crunchbaseUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: low

# News mentioning an entity. Diffbot tags every article with the KG entities it mentions, and the
# tag carries the entity's URI — so this is a genuine "articles about THIS company" rather than a
# name search that would also return every unrelated company sharing the name.
#
# `date` and `sentiment` push down: the whole point of this join is usually a recent-and-negative
# slice, and without pushdown that slice costs a full 50-article fetch to keep three.
- name: articlesByEntity
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Article tags.uri:or({keys}) {filters} revSortBy:date"
    size: 10
  keyTemplate: '"https://diffbot.com/entity/{key}"'
  keyJoin: ","
  # ONE ANCHOR PER CALL, for two independent reasons that happen to agree.
  #
  # Correctness: an article record carries the entities it mentions as tags, but nothing in the
  # response says WHICH of the ids we asked about matched it — so a batched call returns rows that
  # cannot be mapped back to their anchor, the join edge never forms, and every row silently
  # vanishes while the query reports success. echoKeyAs stamps the queried entity id onto each
  # record, which is what recordKeyField matches on, and implies per-key calling.
  #
  # Completeness: a batched `tags.uri:or(...)` returns ONE date-ranked list capped at 50 across
  # every company in the batch — a heavily covered company fills the cap and a quiet one falls off
  # the end, so you would see its news for one question and find nothing for the next. batchSafe is
  # declared explicitly even though echoKeyAs already implies it, so the reason survives an edit.
  echoKeyAs: matchedFor
  batchSafe: false
  records: "$.data[*].entity"
  pushdown:
    # Correctness never depends on these — anything not pushed is still filtered graph-side, so the
    # rows are identical and only the cost changes. The valuePatterns admit only Diffbot's own
    # literal forms, so nothing user-shaped reaches the source as syntax.
    - property: date
      op: GREATER_THAN
      qualifier: 'date>"{value}"'
      valuePattern: '^(\d{4}-\d{2}-\d{2})'
    - property: date
      op: LESS_THAN
      qualifier: 'date<"{value}"'
      valuePattern: '^(\d{4}-\d{2}-\d{2})'
    - property: sentiment
      op: LESS_THAN
      qualifier: "sentiment<{value}"
      valuePattern: '^(-?[01](?:\.\d+)?)$'
    - property: sentiment
      op: GREATER_THAN
      qualifier: "sentiment>{value}"
      valuePattern: '^(-?[01](?:\.\d+)?)$'
    - property: language
      op: EQUALS
      qualifier: 'language:"{value}"'
      valuePattern: "^([a-z]{2})$"
  project:
    diffbotId: id
    title: title
    siteName: siteName
    author: author
    date: date.str
    dateTimestamp: date.timestamp
    sentiment: sentiment
    language: language
    pageUrl: pageUrl
    summary: summary
    publisherRegion: publisherRegion
    diffbotUri: diffbotUri
  cache:
    kind: ttl
    seconds: 3600             # news is the one thing here that genuinely changes hourly
    negativeTtlSeconds: 3600
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: medium

# Open roles at a company — a demand signal nobody expects to find in Diffbot, and one that reads
# entirely off the employer reference, so it costs one call for many companies.
- name: jobsByEmployer
  kind: remote
  operation: dqlSearch
  args:
    query: "type:JobPost employer.id:or({keys}) {filters} revSortBy:date"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  maxKeysPerCall: 25
  records: "$.data[*].entity"
  pushdown:
    - property: date
      op: GREATER_THAN
      qualifier: 'date>"{value}"'
      valuePattern: '^(\d{4}-\d{2}-\d{2})'
    - property: remote
      op: EQUALS
      qualifier: 'remote:"{value}"'
      valuePattern: "^([A-Z_]+)$"
  project:
    diffbotId: id
    title: name
    employerId: employer.targetDiffbotId
    employerName: employer.name
    date: date.str
    dateTimestamp: date.timestamp
    remote: remote.normalizedValue
    city: locations.0.city.name
    country: locations.0.country.name
    description: description
    # Diffbot resolves each required skill to its own KG entity; the names are what a reader wants.
    skills: skills[*].name
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: medium

# PAST employees. `isCurrent:false` asks Diffbot for anyone holding a NON-current employment record
# at the company — which is NOT the same as "left". Someone promoted internally has an old role at
# the same employer, so Tim Cook comes back as an Apple alum. The honest alumni set is this MINUS the
# current staff, and that subtraction is a graph-side NOT EXISTS over the EMPLOYS edge — one of the
# clearest cases where composing two source queries beats either one alone, because Diffbot cannot
# express the difference at all.
- name: alumniByEmployer
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Person employments.{employer.id:or({keys}) isCurrent:false}"
    size: 10
  keyTemplate: '"{key}"'
  keyJoin: ","
  echoKeyAs: matchedFor
  batchSafe: false
  records: "$.data[*].entity"
  project:
    diffbotId: id
    name: name
    summary: summary
    description: description
    importance: importance
    nbOrigins: nbOrigins
    currentTitle: employments.0.title
    currentEmployerId: employments.0.employer.targetDiffbotId
    currentEmployerName: employments.0.employer.name
    employerIds: employments[*].employer.targetDiffbotId
    employerNames: employments[*].employer.name
    titles: employments[*].title
    city: location.city.name
    region: location.region.name
    country: location.country.name
    linkedInUri: linkedInUri
    githubUri: githubUri
    twitterUri: twitterUri
    crunchbaseUri: crunchbaseUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: low
- name: orgEnhanceByName
  kind: remote
  operation: enhance
  keyArg: name
  echoKeyAs: matchedFor
  args:
    type: Organization
    # 0.45, not the 0.75 a domain lookup can afford. A NAME is a weak signal and enhance scores it
    # that way: measured live, the CORRECT top match scored 0.73 for "Apple", 0.68 for "Warner Bros.
    # Entertainment", 0.56 for "Village Roadshow Pictures" and 0.52 for "Silver Pictures". A 0.75
    # floor rejected all four — every film studio silently failed to resolve, and PRODUCED_BY
    # returned nothing while looking like a company with no parent.
    #
    # The floor still earns its place: the runner-up scored 0.26 for "Apple" and 0.15 for "Silver
    # Pictures", so the gap between right and wrong is wide even where the absolute score is low.
    threshold: 0.45
    # ONE match. enhance ranks candidates, but this producer echoes the queried name onto EVERY
    # record it returns — so asking for three candidates would link all three to the anchor and
    # attribute a film to two studios it has nothing to do with.
    size: 1
  records: "$.data[*].entity"
  project:
    diffbotId: id
    name: name
    homepageUri: homepageUri
    summary: summary
    nbEmployees: nbEmployees
    revenue: revenue.value
    revenueCurrency: revenue.currency
    foundingDate: foundingDate.str
    foundingDateTimestamp: foundingDate.timestamp
    isPublic: isPublic
    isAcquired: isAcquired
    isDissolved: isDissolved
    isNonProfit: isNonProfit
    importance: importance
    nbOrigins: nbOrigins
    industries: industries
    descriptors: descriptors
    city: location.city.name
    region: location.region.name
    country: location.country.name
    parentCompanyId: parentCompany.targetDiffbotId
    parentCompanyName: parentCompany.name
    ultimateParentId: ultimateParent.targetDiffbotId
    ultimateParentName: ultimateParent.name
    acquiredById: acquiredBy.targetDiffbotId
    acquiredByName: acquiredBy.name
    ceoId: ceo.targetDiffbotId
    ceoName: ceo.name
    stockSymbol: stock.symbol
    stockExchange: stock.exchange
    capitalization: capitalization.value
    linkedInUri: linkedInUri
    crunchbaseUri: crunchbaseUri
    githubUri: githubUri
    twitterUri: twitterUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: medium

# Same reasoning for people. A film's directors and cast arrive as bare names — Diffbot does not
# resolve them to entity ids the way it resolves parentCompany — so the only honest way across is a
# scored match, with a threshold that prefers no answer to the wrong human.
- name: personEnhanceByName
  kind: remote
  operation: enhance
  keyArg: name
  echoKeyAs: matchedFor
  args:
    type: Person
    # Same reasoning as orgEnhanceByName: a bare personal name scores in the 0.5-0.7 band even when
    # the top match is right. People are riskier than companies here — names collide far more often
    # — so this stays a best guess to be checked, never a fact to repeat.
    threshold: 0.45
    size: 1
  records: "$.data[*].entity"
  project:
    diffbotId: id
    name: name
    summary: summary
    description: description
    importance: importance
    nbOrigins: nbOrigins
    currentTitle: employments.0.title
    currentEmployerId: employments.0.employer.targetDiffbotId
    currentEmployerName: employments.0.employer.name
    employerIds: employments[*].employer.targetDiffbotId
    employerNames: employments[*].employer.name
    titles: employments[*].title
    city: location.city.name
    region: location.region.name
    country: location.country.name
    linkedInUri: linkedInUri
    githubUri: githubUri
    twitterUri: twitterUri
    crunchbaseUri: crunchbaseUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }
  cost:
    bucket: diffbot
    rate: "5/sec"
    yield: medium
