# ---------------------------------------------------------------------------------------------
# Structured search. NO MODEL IN THE FETCH PATH.
# ---------------------------------------------------------------------------------------------
#
# These replace three producers that asked an LLM to rewrite plain English into DQL. That design put
# a model between the query and the source, and it failed in every way the arrangement invites: it
# emitted `industries:"Real Estate" or("Property Management",...)` — a bare or() with no field
# attached — which Diffbot rejected with a 400, so the producer contributed no records and the error
# surfaced three hops away as a missing relationship type. The bad rewrite was then CACHED for a
# week, so fixing the prompt could not heal the phrase that had broken.
#
# The engine already had the deterministic mechanism. The anchor's identity supplies the primary
# filter and `pushdown:` renders the query's OWN predicates into DQL by rule, so
#
#   MATCH (:DiffbotIndustry {name:'Real Estate'})-[:HAS_COMPANY]->(o:DiffbotOrganization)
#   WHERE o.country = 'Australia' AND o.nbEmployees > 500
#
# sends `type:Organization industries:"Real Estate" location.country.name:"Australia" nbEmployees>500`
# with nothing generated. The LLM writes Cypher, which is the one language it should write, and a
# malformed source query stops being expressible.
#
# CORRECTNESS NEVER DEPENDS ON PUSHDOWN. Every rule carries a valuePattern, and a value that fails it
# is left to filter graph-side rather than pasted into DQL it would break — same rows, lower cost.

- name: orgsByIndustry
  kind: remote
  operation: dqlSearch
  args:
    query: "type:Organization industries:{keys} {filters}"
    size: 20
  keyTemplate: '"{key}"'
  # One industry per call. Diffbot's industry matching is loose — `industries:"Real Estate"` and a
  # three-way or() over related labels both report ~2.5M hits — so batching several into one ranked,
  # capped list would let the broadest label crowd the others out.
  batchSafe: false
  echoKeyAs: matchedFor
  records: "$.data[*].entity"
  pushdown:
    - property: country
      op: EQUALS
      qualifier: 'location.country.name:"{value}"'
      valuePattern: "^([A-Za-z .'-]+)$"
    - property: city
      op: EQUALS
      qualifier: 'location.city.name:"{value}"'
      valuePattern: "^([A-Za-z .'-]+)$"
    - property: region
      op: EQUALS
      qualifier: 'location.region.name:"{value}"'
      valuePattern: "^([A-Za-z .'-]+)$"
    - property: nbEmployees
      op: GREATER_THAN
      qualifier: "nbEmployees>{value}"
      valuePattern: "^([0-9]+)$"
    - property: nbEmployees
      op: LESS_THAN
      qualifier: "nbEmployees<{value}"
      valuePattern: "^([0-9]+)$"
    - property: isPublic
      op: EQUALS
      qualifier: "isPublic:{value}"
      valuePattern: "^(true|false)$"
    - property: isAcquired
      op: EQUALS
      qualifier: "isAcquired:{value}"
      valuePattern: "^(true|false)$"
    - property: name
      op: CONTAINS
      qualifier: 'name:"{value}"'
      valuePattern: "^([A-Za-z0-9 .,'&-]+)$"
  project:
    diffbotId: id
    name: name
    homepageUri: homepageUri
    summary: summary
    nbEmployees: nbEmployees
    nbEmployeesMin: nbEmployeesMin
    nbEmployeesMax: nbEmployeesMax
    revenue: revenue.value
    revenueCurrency: revenue.currency
    foundingDate: foundingDate.str
    foundingDateTimestamp: foundingDate.timestamp
    isPublic: isPublic
    isAcquired: isAcquired
    isDissolved: isDissolved
    isNonProfit: isNonProfit
    importance: importance
    nbOrigins: nbOrigins
    industries: industries
    descriptors: descriptors
    city: location.city.name
    region: location.region.name
    country: location.country.name
    parentCompanyId: parentCompany.targetDiffbotId
    parentCompanyName: parentCompany.name
    ultimateParentId: ultimateParent.targetDiffbotId
    ultimateParentName: ultimateParent.name
    acquiredById: acquiredBy.targetDiffbotId
    acquiredByName: acquiredBy.name
    ceoId: ceo.targetDiffbotId
    ceoName: ceo.name
    stockSymbol: stock.symbol
    stockExchange: stock.exchange
    capitalization: capitalization.value
    linkedInUri: linkedInUri
    crunchbaseUri: crunchbaseUri
    githubUri: githubUri
    twitterUri: twitterUri
    diffbotUri: diffbotUri
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }
  cost: { bucket: diffbot, rate: "5/sec", yield: medium }

