# The Diffbot Organization, and the corporate structure around it.
#
# This file is the reason the realm exists. Diffbot's ownership fields — parentCompany,
# ultimateParent, subsidiaries, acquiredBy — are resolved references, so the ownership graph is
# already there and already correct; what is missing from Diffbot's own surface is the ability to
# WALK it. Declaring these as self-recursive virtual joins makes
#
#   MATCH (d:DiffbotOrganization {name:'Acme'})-[:PARENT_COMPANY*1..4]->(owner)
#
# one query instead of four manual round-trips with the ids copied between them.

- name: DiffbotOrganization
  userAnchor: false
  description: |
    A company, non-profit or other organization as the Diffbot Knowledge Graph currently holds it,
    fused from many public web sources and materialized transiently for the life of one query.

    A Diffbot record is what the public web says about an organization, not a register of fact.
    Headcount and revenue are estimates, `foundingDate` is often the date of the earliest source
    rather than of incorporation, and a private company's record is far thinner than a listed one's.
    `nbOrigins` — how many sources the record was fused from — is the honest confidence signal:
    hundreds means a well-covered company, a handful means one press release.
  properties:
    diffbotId:
      identity: true
      description: "Stable Diffbot entity id. The key every structural hop in this realm joins on."
    name: "Organization name as Diffbot canonicalizes it."
    homepageUri: "Primary website. The strongest identifier a company has here — names are not unique, domains are."
    summary: "Short description Diffbot composed from its sources."
    nbEmployees: { type: int, description: "Estimated current headcount. An estimate from public signals, not a filing." }
    nbEmployeesMin: { type: int, description: "Lower bound of the estimated headcount range." }
    nbEmployeesMax: { type: int, description: "Upper bound of the estimated headcount range." }
    revenue: { type: int, description: "Estimated annual revenue, in revenueCurrency. Reliable for listed companies, an inference for private ones." }
    revenueCurrency: "Currency of the revenue estimate."
    foundingDate: "Founding date in Diffbot's own textual form, which carries a leading `d` (e.g. `d2000-05-22`). DISPLAY ONLY — a lexical comparison against a plain ISO date is meaningless because `d` sorts above every digit. Filter on foundingDateTimestamp."
    foundingDateTimestamp: { type: int, description: "Founding date as epoch milliseconds. The filterable twin of foundingDate — verified live 2026-08-14." }
    isPublic: { type: boolean, description: "Publicly listed." }
    isAcquired: { type: boolean, description: "Diffbot believes this organization has been acquired. Pair with acquiredBy." }
    isDissolved: { type: boolean, description: "Diffbot believes this organization no longer operates." }
    isNonProfit: { type: boolean, description: "Registered as a non-profit." }
    importance: { type: float, description: "Diffbot's own prominence score. Ranks entities against each other; means nothing in absolute terms." }
    nbOrigins: { type: int, description: "How many distinct web sources this record was fused from — the coverage signal. Low means thin evidence." }
    industries: { cardinality: LIST, description: "Diffbot industry labels." }
    descriptors: { cardinality: LIST, description: "Short descriptive phrases Diffbot extracted, e.g. 'web data company'." }
    city: "City of the primary location."
    region: "State or region of the primary location."
    country: "Country of the primary location."
    parentCompanyId: "Diffbot id of the immediate parent — the key the PARENT_COMPANY hop follows."
    parentCompanyName: "Name of the immediate parent, present without following the hop."
    ultimateParentId: "Diffbot id of the topmost owner, as Diffbot computes it."
    ultimateParentName: "Name of the topmost owner. Compare against a walked PARENT_COMPANY chain rather than trusting either alone."
    acquiredById: "Diffbot id of the acquirer, when isAcquired."
    acquiredByName: "Name of the acquirer."
    ceoId: "Diffbot id of the CEO."
    ceoName: "CEO name, present without following the LED_BY hop."
    stockSymbol: "Primary ticker, when listed. Diffbot returns `stock` as a single OBJECT, not a list — verified live 2026-08-14."
    stockExchange: "Exchange the ticker trades on, e.g. `Nasdaq (NASDAQ)`."
    capitalization: { type: int, description: "Market capitalization in the record's own currency, when listed." }
    linkedInUri: "LinkedIn company page."
    crunchbaseUri: "Crunchbase profile."
    githubUri: "GitHub organization."
    twitterUri: "X/Twitter profile."
    diffbotUri: "Canonical https://diffbot.com/entity/<id> URI. Also the value article tags carry."
    matchedFor: "What this record was fetched for — a domain, a question, or the id of the company it was named a competitor of — echoed by the producer so the join matches what was asked rather than what came back."

  virtualJoins:
    # ------------------------------------------------------------------------------------------
    # The bridge into the world's own graph.
    # ------------------------------------------------------------------------------------------
    # Organization is a CORE label — every world has it, populated from correspondence — so this
    # realm attaches to the user's real data without depending on any other realm being installed.
    #
    # Resolved lazily, per anchor a query actually binds, and PERSISTED: the identity is stable and
    # expensive, the facts are volatile and cheap, so the bridge is cached while everything reached
    # through it rolls back. Domain first because a domain identifies a company and a name does not;
    # for an organization with no domain in the graph, set Organization.diffbotId by hand and the
    # learnedHandle rule picks it up without a lookup.
    - anchorLabel: Organization
      relationship: HAS_DIFFBOT_ORG
      keyField: domain
      recordKeyField: matchedFor
      producer: orgEnhanceByDomain
      writeThrough: true
      refreshAfter: 90d
      resolve:
        - existingBridge
        - learnedHandle: { property: diffbotId, as: diffbotId }
        - canonicalDomain: { producer: orgEnhanceByDomain }
      maxAnchors: 50

    # ------------------------------------------------------------------------------------------
    # Ownership — the self-recursive hops. This is the capability DQL does not have.
    # ------------------------------------------------------------------------------------------
    # Upward. Anchor and target are the same type, so a variable-length pattern walks it:
    #   MATCH (d:DiffbotOrganization {name:'Acme'})-[:PARENT_COMPANY*1..4]->(o) RETURN o.name
    # Every hop resolves before the query evaluates, cycles terminate, and each fetched edge carries
    # sourceId/sourceName/hop provenance. maxFanoutTotal is the whole walk's budget, not one hop's.
    - anchorLabel: DiffbotOrganization
      relationship: PARENT_COMPANY
      keyField: parentCompanyId
      recordKeyField: diffbotId
      producer: orgsById
      maxAnchors: 50
      maxFanoutTotal: 200

    # Diffbot's own answer to "who ultimately owns this", in one hop. Kept alongside the walk rather
    # than instead of it: they are computed differently and disagreeing is informative — a walk that
    # ends somewhere other than ultimateParent means Diffbot's chain and its rollup were built from
    # different sources.
    - anchorLabel: DiffbotOrganization
      relationship: ULTIMATE_PARENT
      keyField: ultimateParentId
      recordKeyField: diffbotId
      producer: orgsById
      maxAnchors: 50
      maxFanoutTotal: 50

    # Downward, and the best-supported query in the realm — Diffbot's own documentation demonstrates
    # exactly this reverse lookup. Recursive in the same way:
    #   MATCH (d:DiffbotOrganization {name:'Acme'})<-[:SUBSIDIARY_OF*1..3]-(sub)
    #   RETURN sum(sub.nbEmployees)
    # Note the direction: the edge is declared FROM the child, so a group rollup reads inbound.
    - anchorLabel: DiffbotOrganization
      relationship: SUBSIDIARY_OF
      keyField: diffbotId
      recordKeyField: parentCompanyId
      producer: orgsByParent
      maxAnchors: 25
      maxFanoutTotal: 500

    - anchorLabel: DiffbotOrganization
      relationship: ACQUIRED_BY
      keyField: acquiredById
      recordKeyField: diffbotId
      producer: orgsById
      maxAnchors: 50
      maxFanoutTotal: 50

    # INBOUND competitors: organizations that name this one as a competitor. Deliberately not the
    # record's own `competitors` list — the two disagree, and presenting the inbound view as the
    # company's own claim would be a fabrication. Low cap: this is the least reliable edge here.
    #
    # recordKeyField is matchedFor, NOT diffbotId. The records coming back are the OTHER companies:
    # their own id identifies them, not the anchor we searched for, so matching on it would compare
    # two different companies' ids and the edge would never form. The producer echoes the queried id
    # instead, which is also why it fetches one anchor at a time.
    - anchorLabel: DiffbotOrganization
      relationship: COMPETES_WITH
      keyField: diffbotId
      recordKeyField: matchedFor
      producer: orgsByCompetitor
      maxAnchors: 10
      maxFanoutTotal: 100

    # A film's production companies, resolved by scored name match. This is the hop that connects
    # the film catalogue to the ownership graph: once a studio is a real DiffbotOrganization, every
    # PARENT_COMPANY / SUBSIDIARY_OF / ACQUIRED_BY hop above is available from it.
    #
    # productionCompanyNames is LIST-valued, so each studio becomes its own key and many films
    # naming the same studio converge on one node — which is what makes counting possible.
    - anchorLabel: DiffbotMovie
      relationship: PRODUCED_BY
      keyField: productionCompanyNames
      recordKeyField: matchedFor
      producer: orgEnhanceByName
      maxAnchors: 50
      maxFanoutTotal: 150

    # EVERY company in a person's history, not just the current one — a per-element join over the
    # employerIds LIST, so one person fans out to each employer and many people converge on one
    # company node. That convergence is the point: it is what makes "where did this company's leavers
    # go" a counting question rather than a reading exercise.
    - anchorLabel: DiffbotPerson
      relationship: CAREER_AT
      keyField: employerIds
      recordKeyField: diffbotId
      producer: orgsById
      maxAnchors: 50
      maxFanoutTotal: 400

    # Where a person works, walked from the person into the company — so an inbox contact resolves
    # to a person, the person to an employer, and the employer up its ownership chain. Three hops,
    # none of which Diffbot can traverse.
    - anchorLabel: DiffbotPerson
      relationship: WORKS_AT
      keyField: currentEmployerId
      recordKeyField: diffbotId
      producer: orgsById
      maxAnchors: 50
      maxFanoutTotal: 100

    # ------------------------------------------------------------------------------------------
    # Resolution — ONE company, by name.
    # ------------------------------------------------------------------------------------------
    # Distinct from MATCHED below, and the distinction is load-bearing. A SEARCH binds its whole
    # result set: `(:DiffbotOrgSearch {ask:'Apple'})-[:MATCHED]->(o)` binds every company the query
    # matched, so a downstream per-company fetch fans out across all of them and trips maxAnchors —
    #   "would bind 50 source nodes, exceeding maxAnchors 10"
    # which is the engine correctly refusing to spend fifty fetches on a question about one company.
    #
    # RESOLVED_TO binds exactly one, because enhance returns a single scored best match rather than
    # a ranked list. Use this whenever a view means "this company"; use MATCHED only when it really
    # means "every company like this".
    - anchorLabel: DiffbotCompany
      relationship: RESOLVED_TO
      keyField: name
      recordKeyField: matchedFor
      producer: orgEnhanceByName
      maxAnchors: 10
      maxFanoutTotal: 10

    # ------------------------------------------------------------------------------------------
    # Structured search — no anchor in the graph, and no model in the fetch.
    # ------------------------------------------------------------------------------------------
    # The industry IS the key: it drives the source query directly. Everything else the caller wants
    # is an ordinary Cypher predicate that `pushdown:` renders into DQL by rule —
    #
    #   MATCH (:DiffbotIndustry {name:'Real Estate'})-[:HAS_COMPANY]->(o:DiffbotOrganization)
    #   WHERE o.country = 'Australia' AND o.nbEmployees > 500
    #
    # so nothing is generated and a malformed source query cannot be produced. Predicates without a
    # rule (or whose value fails its pattern) filter graph-side instead: same rows, higher cost.
    - anchorLabel: DiffbotIndustry
      relationship: HAS_COMPANY
      keyField: name
      recordKeyField: matchedFor
      producer: orgsByIndustry
      maxAnchors: 4
      maxFanoutTotal: 200

# A named company, literal-seeded and resolved to exactly one entity. The entry point for every
# question about ONE company — ownership, siblings, leavers, competitors, board seats.
- name: DiffbotCompany
  userAnchor: false
  description: |
    One company, named. Traverse RESOLVED_TO to resolve the name to a single Diffbot entity, then
    every structural hop is available from it.

    Resolution is a scored best match, so a name that is ambiguous or absent yields nothing rather
    than a guess. Names are weak evidence: prefer the fullest form you have.
  properties:
    name:
      identity: true
      description: "The company name, as a person would write it."

# A literal-seeded industry, and the entry point for "companies like this". Its name is sent to the
# source verbatim as `industries:"<name>"`, so it must be an industry LABEL Diffbot uses ("Real
# Estate", "Software Companies", "Mining"), not a description of one.
- name: DiffbotIndustry
  userAnchor: false
  description: |
    A Diffbot industry label, used as a search anchor. Traverse HAS_COMPANY to find companies in it,
    and narrow with ordinary predicates on the company — country, city, headcount, isPublic — which
    are pushed to the source rather than applied after fetching.

    Matching is loose: "Real Estate" alone reports ~2.5M companies, so a bare traversal is a sample
    of the index rather than a census. Always narrow it.
  properties:
    name:
      identity: true
      description: "The industry label as Diffbot spells it, e.g. 'Real Estate', 'Software Companies', 'Mining'."
