# Saved views.
#
# ENTRY POINTS. There are two, and picking the wrong one is the most common way to break a query.
#
#   ONE company   MATCH (:DiffbotCompany {name: $c})-[:RESOLVED_TO]->(d:DiffbotOrganization)
#   MANY companies MATCH (:DiffbotOrgSearch {ask: $q})-[:MATCHED]->(o:DiffbotOrganization)
#
# RESOLVED_TO binds exactly one entity (a scored best match). MATCHED binds the whole result set —
# up to twenty companies — so any per-company fetch downstream fans out across all of them and the
# engine refuses it:
#
#   fetching 'DiffbotPerson' via 'EMPLOYS' from each (:DiffbotOrganization) would bind 50 source
#   nodes, exceeding maxAnchors 10 — narrow the (:DiffbotOrganization) set
#
# That is the engine being right: fifty fetches to answer a question about one company. Use
# RESOLVED_TO whenever the view means "this company", and MATCHED only when it means "every company
# like this" AND the hops after it are cheap.
#
# NEITHER can be replaced by `(d:DiffbotOrganization {name: $c})`. A literal-seeded anchor carries
# only the property you pinned, and every structural producer keys on `diffbotId` — so a name-seeded
# node has no key, nothing is fetched, and the query returns zero rows while reporting success.
#
# The exception is a view anchored in the USER'S graph (`:Organization`, `:Person`), where the bridge
# supplies the id. Those are the better queries anyway — the anchor is data Diffbot cannot see.

- name: CompanyProfile
  description: |
    One company, resolved from a name or a describing phrase, as a node other traversals compose
    onto. The starting point for most of the views below.
  outputLabel: DiffbotOrganization
  params:
    ask:
      type: string
      default: "Diffbot"
      description: "The company name."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(o:DiffbotOrganization)
    RETURN o

- name: CompanySearch
  description: |
    Ask Diffbot for companies in plain language. The question is rewritten into DQL at the source and
    the rewrite is echoed back, so what actually ran can be shown. Capped at 50 — a sample of the
    index, never a census.
  outputLabel: DiffbotOrganization
  params:
    ask:
      type: string
      default: "software companies in Sydney with more than 500 staff"
      description: "The question, in plain language."
  cypher: |
    MATCH (:DiffbotOrgSearch {ask: $ask})-[:MATCHED]->(o:DiffbotOrganization)
    RETURN o

- name: CompanyOwnership
  description: |
    The ownership chain above a company, walked level by level. The question Diffbot holds the data
    for and cannot answer: each level is a separate lookup on its side, with the ids copied by hand.
  params:
    ask:
      type: string
      default: "Shazam"
      description: "The company name."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(d:DiffbotOrganization)
    MATCH path = (d)-[:PARENT_COMPANY*1..4]->(owner:DiffbotOrganization)
    RETURN length(path) AS level,
           owner.name AS owner,
           owner.country AS country,
           owner.nbEmployees AS ownerHeadcount,
           owner.isPublic AS ownerIsPublic,
           owner.diffbotUri AS source
    ORDER BY level ASC

- name: GroupRollup
  description: |
    A company plus everything beneath it. The totals are SUMS of Diffbot's per-entity estimates — a
    scale indication, not a consolidated account — and a lower bound whenever the walk stops at its
    declared depth.
  params:
    ask:
      type: string
      default: "Apple"
      description: "The parent company's name."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(parent:DiffbotOrganization)
    OPTIONAL MATCH (parent)<-[:SUBSIDIARY_OF*1..3]-(sub:DiffbotOrganization)
    RETURN parent.name AS group,
           count(DISTINCT sub) AS entities,
           sum(sub.nbEmployees) AS estimatedGroupHeadcount,
           sum(sub.revenue) AS estimatedGroupRevenue,
           collect(DISTINCT sub.country)[0..20] AS countries

- name: SiblingCompanies
  description: |
    Companies under the same ultimate owner as one you already deal with — the accounts you have a
    relationship with by proxy and are probably not calling. Two recursive walks meeting at the top:
    up from your company to the parent, then back down every other branch.
  params:
    ask:
      type: string
      default: "Shazam"
      description: "The name of a company you already deal with."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(d:DiffbotOrganization)
    MATCH (d)-[:PARENT_COMPANY*1..3]->(top:DiffbotOrganization)
    MATCH (top)<-[:SUBSIDIARY_OF*1..3]-(sibling:DiffbotOrganization)
    WHERE sibling.diffbotId <> d.diffbotId
    RETURN top.name AS group,
           sibling.name AS sibling,
           sibling.country AS country,
           sibling.nbEmployees AS headcount,
           sibling.industries AS industries
    ORDER BY headcount DESC

- name: WhoOwnsThisMarket
  description: |
    Search a market in plain language, then walk every result to its ultimate owner. Diffbot answers
    the first half and stops; the ownership column needs traversal, and it is usually the half that
    matters — an apparently fragmented sector often has three owners.
  params:
    ask:
      type: string
      default: "mining companies in Western Australia with more than 500 staff"
      description: "The market, in plain language."
    companies:
      type: int
      default: 10
      description: "How many of the matched companies to walk upward. Each one costs its own chain of fetches, so this is the view's spending ceiling."
  cypher: |
    MATCH (:DiffbotOrgSearch {ask: $ask})-[:MATCHED]->(o:DiffbotOrganization)
    WITH o ORDER BY o.importance DESC LIMIT $companies
    OPTIONAL MATCH (o)-[:PARENT_COMPANY*1..3]->(owner:DiffbotOrganization)
    WITH o, collect(owner)[-1] AS ultimate
    RETURN coalesce(ultimate.name, o.name) AS ultimateOwner,
           coalesce(ultimate.country, o.country) AS ownerCountry,
           count(o) AS companiesInMarket,
           collect(o.name)[0..6] AS examples,
           sum(o.nbEmployees) AS estimatedStaff
    ORDER BY companiesInMarket DESC

- name: BoardInterlocks
  description: |
    People who sit on the boards of BOTH of two companies.

    Only ONE company's people are fetched; the other is tested against each person's own employment
    history, which the record already carries. So the intersection is exact on that side rather than
    limited to whoever fell inside one page, and it costs one fetch instead of two.

    IT MATCHES ON NAME, NOT ON ENTITY ID, and that is deliberate. Diffbot's ids are not canonical
    across access paths: an employment reference to Google carries EUFq-3WlpNsq0pvfUYWXOEA while
    `enhance(url=google.com)` returns EkUDBjismNf-8fUxNwfOCBw — the same company, two records. An
    id-equality test between the two therefore matches nothing and says so silently. A further 12%
    of employment references carry no id at all. Names are what references reliably carry.

    A BOARD SEAT IS NOT ANY TITLE CONTAINING "Director". That substring catches "Director of
    Technical Operations" and every other middle manager, so this wants a title containing "Board",
    or one ENDING in "Director" (Non-Executive, Lead Independent) while excluding "Managing
    Director", which is an executive role almost everywhere.
  params:
    ask:
      type: string
      default: "Apple"
      description: "Name of the company whose people are fetched."
    otherCompany:
      type: string
      default: "Google"
      description: "Name matched against each person's employment history. Substring, case-insensitive — 'Google' also catches 'Google DeepMind'."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(a:DiffbotOrganization)
    MATCH (a)-[:EMPLOYS]->(p:DiffbotPerson)
    WHERE ANY(n IN p.employerNames WHERE toLower(n) CONTAINS toLower($otherCompany))
      AND ANY(t IN p.titles WHERE
                t CONTAINS 'Board'
                OR (t ENDS WITH 'Director' AND NOT t CONTAINS 'Managing'))
    WITH p, [t IN p.titles WHERE
               t CONTAINS 'Board'
               OR (t ENDS WITH 'Director' AND NOT t CONTAINS 'Managing')] AS directorships
    RETURN p.name AS person,
           directorships[0..4] AS directorships,
           p.employerNames AS everywhereTheySit,
           p.linkedInUri AS profile
    ORDER BY size(p.employerNames) DESC
    LIMIT 50

- name: TalentFlow
  description: |
    Where a company's leavers actually went.

    Diffbot's past-employment filter also returns people still there under an earlier title — someone
    promoted internally holds a non-current role at the same employer — so the honest alumni set is
    the past-employee edge MINUS the current-staff edge. That set difference is the whole trick, and
    Diffbot cannot express it: it is two queries whose results have to meet somewhere.
  params:
    ask:
      type: string
      default: "Diffbot"
      description: "The company's name."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(o:DiffbotOrganization)
    MATCH (o)-[:FORMERLY_EMPLOYED]->(p:DiffbotPerson)
    WHERE NOT (o)-[:EMPLOYS]->(p)
      AND p.currentEmployerId IS NOT NULL
      AND p.currentEmployerId <> o.diffbotId
    RETURN p.currentEmployerName AS wentTo,
           count(*) AS people,
           collect(p.name)[0..5] AS examples
    ORDER BY people DESC

- name: CompetitorHiring
  description: |
    What the competitors of a company are staffing up for. A hiring plan is the least guarded
    statement of strategy a company makes, and the skills on each posting say more than the titles.

    Note the direction: COMPETES_WITH is INBOUND — companies that name this one as a competitor,
    which is not the same as the ones it names itself.
  params:
    ask:
      type: string
      default: "Diffbot"
      description: "The company's name."
    sinceDays:
      type: int
      default: 90
      description: "How far back to look."
  cypher: |
    MATCH (:DiffbotCompany {name: $ask})-[:RESOLVED_TO]->(d:DiffbotOrganization)
    MATCH (d)-[:COMPETES_WITH]->(rival:DiffbotOrganization)-[:IS_HIRING_FOR]->(j:DiffbotJobPost)
    WHERE j.dateTimestamp > datetime().epochMillis - ($sinceDays * 86400000)
    RETURN rival.name AS competitor,
           j.title AS role,
           j.skills AS skills,
           j.city AS city,
           j.remote AS arrangement,
           j.date AS posted
    ORDER BY j.dateTimestamp DESC

- name: SkillDemand
  description: |
    What capability a whole market is buying, counted across every company's open roles rather than
    read one posting at a time. The unit is the skill, not the job title — "staff engineer" means
    nothing across companies, "Rust" means the same thing everywhere.
  params:
    ask:
      type: string
      default: "companies building large language model products"
      description: "The market, in plain language."
    companies:
      type: int
      default: 10
      description: "How many matched companies to pull postings for. Each costs a fetch."
  cypher: |
    MATCH (:DiffbotOrgSearch {ask: $ask})-[:MATCHED]->(o:DiffbotOrganization)
    WITH o ORDER BY o.importance DESC LIMIT $companies
    MATCH (o)-[:IS_HIRING_FOR]->(j:DiffbotJobPost)
    UNWIND j.skills AS skill
    RETURN skill,
           count(DISTINCT j) AS postings,
           count(DISTINCT o) AS companies,
           collect(DISTINCT o.name)[0..5] AS hiringFor
    ORDER BY postings DESC
    LIMIT 40

- name: PeopleSearch
  description: |
    Ask Diffbot for people in plain language — the person equivalent of CompanySearch. Public
    professional record only, capped at 50.
  outputLabel: DiffbotPerson
  params:
    ask:
      type: string
      default: "CTOs in Melbourne"
      description: "The question, in plain language."
  cypher: |
    MATCH (:DiffbotPersonSearch {ask: $ask})-[:MATCHED]->(p:DiffbotPerson)
    RETURN p

# --------------------------------------------------------------------------------------------------
# Anchored in the user's own graph. These are the ones Diffbot could never run, at any price — the
# starting point is who has actually emailed you, which is not in anybody's index.
# --------------------------------------------------------------------------------------------------

- name: ContactCompanyProfiles
  description: |
    Every company the user's correspondents work for, enriched. The anchor is the inbox, so the
    fan-out is bounded by who has actually emailed rather than by Diffbot's index.
  cypher: |
    MATCH (me:AssistantUser)-[:EMAILED]->(p:Person)-[:WORKS_FOR]->(o:Organization)
    MATCH (o)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    RETURN DISTINCT o.name AS organization,
           d.nbEmployees AS headcount,
           d.revenue AS revenue,
           d.industries AS industries,
           d.country AS country,
           d.ultimateParentName AS ultimateOwner,
           d.isAcquired AS acquired,
           d.nbOrigins AS sourceCount
    ORDER BY headcount DESC

- name: HiddenCommonOwner
  description: |
    Two companies in YOUR world that quietly share an ultimate owner. The kind of thing that changes
    a negotiating position, and that nothing in your own graph records — the link lives in a
    corporate registry neither company puts in its email signature.
  cypher: |
    MATCH (me:AssistantUser)-[:EMAILED]->(:Person)-[:WORKS_FOR]->(oa:Organization)
    MATCH (me)-[:EMAILED]->(:Person)-[:WORKS_FOR]->(ob:Organization)
    WHERE oa.name < ob.name
    MATCH (oa)-[:HAS_DIFFBOT_ORG]->(da:DiffbotOrganization)-[:PARENT_COMPANY*1..3]->(top:DiffbotOrganization)
    MATCH (ob)-[:HAS_DIFFBOT_ORG]->(db:DiffbotOrganization)-[:PARENT_COMPANY*1..3]->(top)
    RETURN top.name AS commonOwner,
           top.country AS ownerCountry,
           oa.name AS companyA,
           ob.name AS companyB

- name: QuietlyAbsorbed
  description: |
    Companies in your world that have been acquired or dissolved without your graph knowing.

    An empty answer is the reassuring one here, which makes it the dangerous direction: a FAILED
    fetch also returns no rows. Read `warnings` before reporting nothing.
  cypher: |
    MATCH (me:AssistantUser)-[:EMAILED]->(:Person)-[:WORKS_FOR]->(o:Organization)
    MATCH (o)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    WHERE d.isAcquired = true OR d.isDissolved = true
    OPTIONAL MATCH (d)-[:ACQUIRED_BY]->(buyer:DiffbotOrganization)
    RETURN o.name AS organization,
           d.isAcquired AS acquired,
           d.isDissolved AS dissolved,
           coalesce(buyer.name, d.acquiredByName, d.ultimateParentName) AS nowOwnedBy,
           d.nbOrigins AS sourceCount

- name: ContactCompanyNews
  description: |
    Recent negative-toned coverage of companies you are in contact with. Date and sentiment push down
    into DQL, so this fetches the slice rather than fetching everything and discarding most of it.
    Sentiment is tone, not wrongdoing — read the articles.
  params:
    sinceDays:
      type: int
      default: 30
      description: "How far back to look."
    maxSentiment:
      type: float
      default: -0.3
      description: "Only articles at or below this tone score."
  cypher: |
    MATCH (me:AssistantUser)-[:EMAILED]->(:Person)-[:WORKS_FOR]->(o:Organization)
    MATCH (o)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)-[:MENTIONED_IN]->(a:DiffbotArticle)
    WHERE a.dateTimestamp > datetime().epochMillis - ($sinceDays * 86400000)
      AND a.sentiment < $maxSentiment
    RETURN o.name AS organization,
           a.title AS headline,
           a.siteName AS publication,
           a.date AS published,
           a.sentiment AS tone,
           a.pageUrl AS url
    ORDER BY a.sentiment ASC

- name: ExecutiveExposure
  description: |
    The people leading companies you deal with, and the press about them personally — the reputational
    surface a company carries through its executives rather than through its own name.
  params:
    sinceDays:
      type: int
      default: 180
      description: "How far back to look."
    maxSentiment:
      type: float
      default: -0.2
      description: "Only coverage at or below this tone."
  cypher: |
    MATCH (me:AssistantUser)-[:EMAILED]->(:Person)-[:WORKS_FOR]->(o:Organization)
    MATCH (o)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)-[:LED_BY]->(exec:DiffbotPerson)
    MATCH (exec)-[:MENTIONED_IN]->(a:DiffbotArticle)
    WHERE a.dateTimestamp > datetime().epochMillis - ($sinceDays * 86400000)
      AND a.sentiment < $maxSentiment
    RETURN o.name AS organization,
           exec.name AS executive,
           a.title AS headline,
           a.siteName AS publication,
           a.sentiment AS tone,
           a.pageUrl AS url
    ORDER BY a.sentiment ASC

- name: HiringSignals
  description: |
    What the companies in your world are advertising for. Visible intent with a lag — a posting
    outlives the vacancy — so read it as direction, not as headcount change.
  params:
    sinceDays:
      type: int
      default: 60
      description: "How far back to look."
  cypher: |
    MATCH (me:AssistantUser)-[:EMAILED]->(:Person)-[:WORKS_FOR]->(o:Organization)
    MATCH (o)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)-[:IS_HIRING_FOR]->(j:DiffbotJobPost)
    WHERE j.dateTimestamp > datetime().epochMillis - ($sinceDays * 86400000)
    RETURN o.name AS organization,
           j.title AS role,
           j.skills AS skills,
           j.city AS city,
           j.remote AS arrangement,
           j.date AS posted
    ORDER BY j.dateTimestamp DESC

# --------------------------------------------------------------------------------------------------
# Film. Diffbot's Movie type is undocumented but real (~2.5M entities), and it matters here because a
# film's production companies are organizations — so the catalogue opens straight into the ownership
# graph above.
# --------------------------------------------------------------------------------------------------

- name: MovieSearch
  description: |
    Ask Diffbot for films in plain language. Rewritten into DQL at the source; capped at 50.
  outputLabel: DiffbotMovie
  params:
    ask:
      type: string
      default: "cyberpunk films after 1990"
      description: "The question, in plain language."
  cypher: |
    MATCH (:DiffbotMovieSearch {ask: $ask})-[:MATCHED]->(f:DiffbotMovie)
    RETURN f

- name: FilmOwnership
  description: |
    Who actually owns the studios behind a set of films. Three questions stacked: a film search, a
    scored name match onto each production company, then the recursive ownership walk. Diffbot holds
    every part and can traverse none of it.

    A studio resolved by name is a good guess, not a fact — check `sourceCount` before repeating it.
  params:
    ask:
      type: string
      default: "cyberpunk films after 1990"
      description: "The films, in plain language."
    films:
      type: int
      default: 8
      description: "How many films to resolve studios for. Each studio name costs its own scored lookup."
  cypher: |
    MATCH (:DiffbotMovieSearch {ask: $ask})-[:MATCHED]->(f:DiffbotMovie)
    WITH f ORDER BY f.wikipediaPageviews DESC LIMIT $films
    MATCH (f)-[:PRODUCED_BY]->(studio:DiffbotOrganization)
    OPTIONAL MATCH (studio)-[:PARENT_COMPANY*1..4]->(owner:DiffbotOrganization)
    WITH f, studio, collect(owner)[-1] AS ultimate
    RETURN coalesce(ultimate.name, studio.name) AS ultimateOwner,
           coalesce(ultimate.country, studio.country) AS ownerCountry,
           count(DISTINCT f) AS films,
           collect(DISTINCT studio.name)[0..6] AS studios,
           collect(DISTINCT f.name)[0..6] AS examples,
           min(studio.nbOrigins) AS sourceCount
    ORDER BY films DESC

- name: DirectorFilmography
  description: |
    A director's films with their cultural footprint. `wikipediaPageviews` against
    `wikipediaPageviewsLastYear` separates an enduring film from a currently-talked-about one.
  params:
    ask:
      type: string
      default: "films directed by Lana Wachowski"
      description: "The filmography, in plain language."
  cypher: |
    MATCH (:DiffbotMovieSearch {ask: $ask})-[:MATCHED]->(f:DiffbotMovie)
    RETURN f.name AS film,
           f.releaseDate AS released,
           f.genres AS genres,
           f.productionCompanyNames AS studios,
           f.wikipediaPageviews AS pageviewsAllTime,
           f.wikipediaPageviewsLastYear AS pageviewsLastYear,
           f.imdbUri AS imdb
    ORDER BY f.releaseDateTimestamp DESC

- name: FilmCast
  description: |
    A film's cast as actor/character rows, from the HAS_CAST sub-graph brought with the film in the
    same fetch — no extra calls.

    Do NOT build this by zipping `castNames` against `characterNames`. A `[*]` projection drops
    elements whose field is absent, so the two lists have different lengths whenever a role is
    unrecorded — 31 against 20 on "The Odyssey" (2026), 4 against 0 on "Ultraman Tiga". Every pairing
    after the first gap is wrong, and an index past the shorter list fails the query outright.

    Only credits with a RECORDED CHARACTER appear — the brought child is keyed on the character,
    because the host reads a brought id off the raw record before projection and the raw entry has no
    top-level actor field. About a third of credits on a well-covered film have no character and are
    therefore absent here; `f.castNames` still holds the complete list.

    Scoped to ONE film, so two roles sharing a character name cannot merge.
  params:
    ask:
      type: string
      default: "The Odyssey"
      description: "The film."
  cypher: |
    MATCH (:DiffbotMovieSearch {ask: $ask})-[:MATCHED]->(f:DiffbotMovie)
    WITH f ORDER BY f.wikipediaPageviews DESC LIMIT 1
    MATCH (f)-[:HAS_CAST]->(c:DiffbotCastMember)
    RETURN f.name AS film,
           f.releaseDate AS released,
           c.actorName AS actor,
           c.characterName AS character,
           size(f.castNames) AS totalCreditsOnFilm
    ORDER BY actor

# --- requires realm-movie -------------------------------------------------------------------------

- name: MyFilmsByOwner
  description: |
    The films YOU have rated, grouped by who ultimately owns the studio that made them. The one
    query in this realm that needs three separate worlds to agree: your own ratings, Diffbot's film
    catalogue, and its corporate ownership graph — joined on an IMDb id and a company name.

    REQUIRES realm-movie. Without it there are no rated films to anchor on and this returns nothing.
  params:
    minRating:
      type: int
      default: 4
      description: "Only films you rated at least this highly."
  cypher: |
    MATCH (r:MovieRating)-[:OF_MOVIE]->(m:Movie)
    WHERE r.rating >= $minRating
    MATCH (m)-[:HAS_DIFFBOT_MOVIE]->(f:DiffbotMovie)-[:PRODUCED_BY]->(studio:DiffbotOrganization)
    OPTIONAL MATCH (studio)-[:PARENT_COMPANY*1..4]->(owner:DiffbotOrganization)
    WITH m, studio, collect(owner)[-1] AS ultimate
    RETURN coalesce(ultimate.name, studio.name) AS ultimateOwner,
           count(DISTINCT m) AS filmsYouRated,
           collect(DISTINCT m.title)[0..8] AS films
    ORDER BY filmsYouRated DESC
